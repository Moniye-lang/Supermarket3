<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="amstoresGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52521" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Tile -->
  <rect width="512" height="512" rx="128" fill="url(#amstoresGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" />

  <!-- Decorative Cart / Mercantile Accent -->
  <g transform="translate(256, 170) scale(1.15)">
    <!-- Cart / Basket Arc -->
    <path d="M-110 -25 C -50 -70, 50 -70, 110 -25" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Small Wheels / Dots -->
    <circle cx="-55" cy="18" r="10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="55" cy="18" r="10" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Bold AM Monogram -->
  <g filter="url(#shadow)">
    <text x="256" y="355" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="200" 
          font-weight="900" 
          letter-spacing="-6"
          fill="#FFFFFF" 
          text-anchor="middle">AM</text>
  </g>

  <!-- Subtitle Tag -->
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="9"
        fill="url(#accentGrad)" 
        text-anchor="middle">STORES</text>
</svg>
